name: Release

# Triggered on:
#   - semver release tags (v0.1.0, v1.2.3) → builds + publishes GitHub Release
#   - workflow_dispatch → manual run from any branch (no publishing unless tagged)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Reuse the CI workflow: lint + cross-compile builds + test (linux + macOS).
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-compile release binaries for all supported platforms / architectures.
  # Darwin builds run on macos-latest for code signing and notarization.
  # ──────────────────────────────────────────────────────────────────────────
  binaries:
    name: Binary / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest }
          - { goos: linux,   goarch: arm64, runner: ubuntu-latest }
          - { goos: darwin,  goarch: amd64, runner: macos-latest }
          - { goos: darwin,  goarch: arm64, runner: macos-latest }
          - { goos: windows, goarch: amd64, runner: ubuntu-latest, ext: .exe }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest, ext: .exe }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >
          make build-cross
          BIN_CROSS=dist/gaal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      # ── Code signing ──────────────────────────────────────────────────────
      # Signing fires only on semver tag pushes. PRs still cross-compile the
      # binary (build regression detection) but skip signing.

      - name: Sign Windows binary
        if: matrix.goos == 'windows' && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/sign-windows
        with:
          binary:       dist/gaal-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          pfx-base64:   ${{ secrets.WINDOWS_CERTIFICATE }}
          pfx-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Sign and notarize macOS binary
        if: matrix.goos == 'darwin' && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/sign-macos
        with:
          binary:       dist/gaal-${{ matrix.goos }}-${{ matrix.goarch }}
          p12-base64:   ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          api-key:      ${{ secrets.APPLE_API_KEY }}
          api-key-id:   ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer:   ${{ secrets.APPLE_API_ISSUER }}

      # ── Upload artifact ────────────────────────────────────────────────────

      - uses: actions/upload-artifact@v7
        with:
          name: gaal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gaal-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Test: run the full test suite natively on every release platform.
  # Guarantees that deliverables are 100% validated on their target platform.
  # Runs in parallel with binaries (both need ci to pass first).
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,       runner: ubuntu-latest    }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macOS,       runner: macos-latest     }
          #- { name: macOS-amd64, runner: macos-13         }
          - { name: windows,     runner: windows-latest   }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        shell: bash
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests
        shell: bash
        run: |
          mkdir -p report
          gotestsum --junitfile report/tests.xml --format github-actions -- -race -count=1 -timeout 5m ./...

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-release-${{ matrix.name }}
          path: report/tests.xml
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Create the GitHub Release and attach all compiled binaries + checksums.
  # Only runs on semver tag pushes — manual dispatches build artifacts
  # but do not publish.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [binaries, test]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: gaal-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
