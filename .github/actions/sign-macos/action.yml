name: Sign and notarize macOS binary (rcodesign)
description: >
  Signs a macOS Mach-O binary with a Developer ID certificate and submits
  it to Apple's notary service using rcodesign. Runs on macos-latest.
  Stapling is omitted — Mach-O binaries cannot be stapled; Gatekeeper
  verifies notarization online.

inputs:
  binary:
    description: Path to the Mach-O binary to sign and notarize (modified in-place).
    required: true
  p12-base64:
    description: Base64-encoded PKCS#12 (.p12) Developer ID Application certificate.
    required: true
  p12-password:
    description: Password for the .p12 file.
    required: true
  api-key:
    description: App Store Connect API key content (.p8 file contents).
    required: true
  api-key-id:
    description: App Store Connect API key ID.
    required: true
  api-issuer:
    description: App Store Connect API issuer UUID.
    required: true

runs:
  using: composite
  steps:
    - name: Install rcodesign
      shell: bash
      env:
        RCODESIGN_VERSION: "0.29.0"
        RCODESIGN_SHA256: "d1a532150adaf90048260d76359261aa716abafc45c53c5dc18845029184334a"
      run: |
        # macos-latest GitHub-hosted runners are ARM64 (M-series).
        ARCHIVE="apple-codesign-${RCODESIGN_VERSION}-aarch64-apple-darwin.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" \
          "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${ARCHIVE}"

        ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/$ARCHIVE" | awk '{print $1}')
        if [ "$RCODESIGN_SHA256" != "$ACTUAL" ]; then
          echo "::error::rcodesign SHA256 mismatch (expected $RCODESIGN_SHA256, got $ACTUAL)"
          exit 1
        fi

        tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" --strip-components=1
        "$RUNNER_TEMP/rcodesign" --version

    - name: Sign and notarize binary
      shell: bash
      env:
        P12_BASE64:   ${{ inputs.p12-base64 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
        API_KEY:      ${{ inputs.api-key }}
        API_KEY_ID:   ${{ inputs.api-key-id }}
        API_ISSUER:   ${{ inputs.api-issuer }}
      run: |
        BINARY="${{ inputs.binary }}"
        P12="$RUNNER_TEMP/cert.p12"
        API_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
        API_KEY_JSON="$RUNNER_TEMP/api-key.json"
        trap 'rm -f "$P12" "$API_KEY_FILE" "$API_KEY_JSON"' EXIT

        echo "$P12_BASE64" | base64 --decode > "$P12"
        echo "$API_KEY"     > "$API_KEY_FILE"

        # Sign with hardened runtime (required for notarization)
        "$RUNNER_TEMP/rcodesign" sign \
          --p12-file "$P12" \
          --p12-password "$P12_PASSWORD" \
          --code-signature-flags runtime \
          "$BINARY"

        # Encode the App Store Connect API key as JSON for rcodesign
        "$RUNNER_TEMP/rcodesign" encode-app-store-connect-api-key \
          -o "$API_KEY_JSON" \
          "$API_ISSUER" "$API_KEY_ID" "$API_KEY_FILE"

        # Apple's notary service requires a wrapped artifact, not a raw Mach-O.
        # Use ditto (not plain zip) to produce an archive the notarizer accepts.
        ditto -c -k --keepParent "$BINARY" "$BINARY.zip"
        "$RUNNER_TEMP/rcodesign" notary-submit \
          --api-key-file "$API_KEY_JSON" \
          --wait \
          "$BINARY.zip"
        rm "$BINARY.zip"

    - name: Verify signature
      shell: bash
      run: |
        codesign --verify --deep --strict --verbose=2 "${{ inputs.binary }}"
        codesign -dvv "${{ inputs.binary }}"
